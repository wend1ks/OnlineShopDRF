{% extends 'base.html' %}
{% load static %}
{% block title %} Корзина {% endblock %}
{% block link %} 
<link rel="stylesheet" href="{% static 'css/style.css' %}">
{% endblock %}

{% block content %} 
<div class="page-center">
    <div class="container" style="max-width: 1200px;">
        <h1>Моя корзина</h1>
        
        <div id="CartItemsContainer" class="cart-items" style="display: flex; flex-wrap: wrap; gap: 20px; justify-content: center;"></div>
        <div id="cartSummary" class="cart-summary" style="display: none;">
            <div class="cart-total">
                <span>Итого:</span>
                <span id="totalPrice" class="cart-total-price">0 Тг</span>
                <button id="orderButton" class="remove-btn" onclick="handleOrder()">Заказать</button>
            </div>
        </div>
    </div>
</div>

<script>
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

async function loadCart() {
    const container = document.getElementById('CartItemsContainer');
    const summary = document.getElementById('cartSummary');
    
    try {
        container.innerHTML = ''
        summary.style.display = 'none'
        
        const response = await fetch('/shop/api/cart/')
        const data = await response.json()
        
        const items = data.items || data
        
        if (items.length === 0) {
            container.innerHTML = '<div class="empty-cart">Корзина пуста</div>'
        } else {
            let total = 0;
            
            items.forEach(item => {
                total += parseFloat(item.line_total || 0)
                
                const card = document.createElement('div')
                card.className = 'card';
                card.style.width = '350px';
                card.id = `cart-item-${item.product}`
                
                card.innerHTML = `
                    <img src="${item.product_image || '/static/images/no-image.png'}" 
                         alt="${item.product_title}" 
                         width="350" height="250" 
                         style="object-fit: cover;"
                         onerror="this.src='/static/images/no-image.png'">
                    <h3>${item.product_title}</h3>
                    <p class="price">${item.product_price} Тг</p>
                    
                    <div class="quantity-controls">
                        <button class="quantity-btn" onclick="updateQuantity(${item.product}, 'minus')">−</button>
                        <span class="quantity-value" id="qty-${item.product}">${item.quantity}</span>
                        <button class="quantity-btn" onclick="updateQuantity(${item.product}, 'plus')">+</button>
                    </div>
                    
                    <p class="price" id="line-total-${item.product}">
                        Итого: ${item.line_total} Тг
                    </p>
                `
                
                container.appendChild(card)
            })
            
            document.getElementById('totalPrice').textContent = `${total} Тг`
            summary.style.display = 'block'
        }
        
    } catch (error) {
        console.error('Error:', error)
    }
}

async function updateQuantity(productId, action) {
    const csrftoken = getCookie('csrftoken');
    const qtySpan = document.getElementById(`qty-${productId}`)
    const oldQty = parseInt(qtySpan.textContent)
    
    if (action === 'plus') {
        qtySpan.textContent = oldQty + 1
    } else if (action === 'minus' && oldQty > 1) {
        qtySpan.textContent = oldQty - 1
    }
    
    try {
        const response = await fetch(`/shop/api/cart/update/${productId}/${action}/`, {
            method: 'POST',
            headers: {
                'X-CSRFToken': csrftoken,
                'Content-Type': 'application/json'
            }
        })
        
        const data = await response.json();
        
        if (response.ok) {
            if (data.deleted) {
                loadCart()
            } else {
                document.getElementById(`qty-${productId}`).textContent = data.quantity;
                document.getElementById(`line-total-${productId}`).textContent = `Итого: ${data.line_total} Тг`;
                updateTotal()
            }
        } else {        
            qtySpan.textContent = oldQty;
            alert(data.error || 'Ошибка при обновлении количества');
        }
    } catch (error) {
        console.error('Error:', error)
        qtySpan.textContent = oldQty
        alert('Ошибка соединения')
    }
}

async function updateTotal() {
    try {
        const response = await fetch('/shop/api/cart/')
        const data = await response.json()
        const items = data.items || data
        
        let total = 0;
        items.forEach(item => {
            total += parseFloat(item.line_total || 0)
        });
        
        document.getElementById('totalPrice').textContent = `${total} Тг`
        
    } catch (error) {
        console.error('Error updating total:', error)
    }
}

async function handleOrder() {
    const button = document.getElementById('orderButton');
    
    try {

        
        const csrftoken = getCookie('csrftoken');
        
        const orderResponse = await fetch('/shop/api/create-order/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': csrftoken
            },
            body: JSON.stringify({})
        });
        
        if (!orderResponse.ok) {
            const error = await orderResponse.json();
            throw new Error(error.error || 'Ошибка создания заказа');
        }
        
        const order = await orderResponse.json();
        console.log('Заказ создан:', order);
        
        const sessionResponse = await fetch(`/shop/api/create-checkout-session/${order.order_id}/`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': csrftoken
            }
        });
        
        if (!sessionResponse.ok) {
            console.log('Ошибка при создании');
            
        }
        
        const session = await sessionResponse.json();
        console.log('Сессия создана:', session);
        
        window.location.href = session.session_url;
        
    } catch (error) {
        console.error('Order error:', error);

        button.textContent = originalText;
        button.disabled = false;
    }
}

document.addEventListener('DOMContentLoaded', loadCart);
</script>
{% endblock %}
