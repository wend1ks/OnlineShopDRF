{% extends 'base.html' %}
{% load static %}
{% block title %}Cart{% endblock %}
{% block link %}
<link rel="stylesheet" href="{% static 'css/style.css' %}">
{% endblock %}
{% block content %}
<div class="page-center">
    <section class="cart-panel">
        <div class="cart-heading">
            <div>
                <h1>My cart</h1>
                <p class="section-subtitle">Review your items before checkout.</p>
            </div>
        </div>

        <div id="CartItemsContainer" class="product-grid"></div>

        <aside id="cartSummary" class="order-summary" style="display: none;">
            <h2>Order summary</h2>
            <div class="summary-row">
                <span>Total</span>
                <span id="totalPrice">$0.00</span>
            </div>
            <button id="orderButton" class="btn btn-primary" onclick="handleOrder()">Checkout</button>
        </aside>
    </section>
</div>

<script>
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

async function loadCart() {
    const container = document.getElementById('CartItemsContainer');
    const summary = document.getElementById('cartSummary');
    try {
        container.innerHTML = '';
        summary.style.display = 'none';

        const response = await fetch('/shop/api/cart/');
        const data = await response.json();
        const items = data.items || data;

        if (!items || items.length === 0) {
            container.innerHTML = '<div class="empty-cart">Your cart is empty</div>';
            return;
        }

        let total = 0;
        items.forEach(item => {
            total += parseFloat(item.line_total || 0);
            const card = document.createElement('article');
            card.className = 'cart-item';
            card.id = `cart-item-${item.product}`;
            card.innerHTML = `
                <img src="${item.product_image || '/static/images/no-image.png'}" alt="${item.product_title}">
                <div class="cart-item-details">
                    <div>
                        <div class="cart-item-title">${item.product_title}</div>
                        <div class="cart-item-price">Price: $${item.product_price}</div>
                    </div>
                    <div class="quantity-controls">
                        <button class="quantity-btn" onclick="updateQuantity(${item.product}, 'minus')">−</button>
                        <span class="quantity-value" id="qty-${item.product}">${item.quantity}</span>
                        <button class="quantity-btn" onclick="updateQuantity(${item.product}, 'plus')">+</button>
                    </div>
                    <div class="cart-item-total">Total: $${item.line_total}</div>
                </div>
            `;
            container.appendChild(card);
        });

        document.getElementById('totalPrice').textContent = `$${total}`;
        summary.style.display = 'block';
    } catch (error) {
        console.error('Error:', error);
        container.innerHTML = '<div class="empty-cart">Could not load your cart.</div>';
    }
}

async function updateQuantity(productId, action) {
    const csrftoken = getCookie('csrftoken');
    const qtySpan = document.getElementById(`qty-${productId}`);
    const oldQty = parseInt(qtySpan.textContent);
    if (action === 'plus') {
        qtySpan.textContent = oldQty + 1;
    } else if (action === 'minus' && oldQty > 1) {
        qtySpan.textContent = oldQty - 1;
    }

    try {
        const response = await fetch(`/shop/api/cart/update/${productId}/${action}/`, {
            method: 'POST',
            headers: {
                'X-CSRFToken': csrftoken,
                'Content-Type': 'application/json'
            }
        });
        const data = await response.json();
        if (response.ok) {
            if (data.deleted) {
                loadCart();
            } else {
                document.getElementById(`qty-${productId}`).textContent = data.quantity;
                document.querySelector(`#cart-item-${productId} .cart-item-total`).textContent = `Total: $${data.line_total}`;
                updateTotal();
            }
        } else {
            qtySpan.textContent = oldQty;
            alert(data.error || 'Could not update quantity');
        }
    } catch (error) {
        console.error('Error:', error);
        qtySpan.textContent = oldQty;
        alert('Connection error');
    }
}

async function updateTotal() {
    try {
        const response = await fetch('/shop/api/cart/');
        const data = await response.json();
        const items = data.items || data;
        let total = 0;
        items.forEach(item => {
            total += parseFloat(item.line_total || 0);
        });
        document.getElementById('totalPrice').textContent = `$${total}`;
    } catch (error) {
        console.error('Error updating total:', error);
    }
}

async function handleOrder() {
    const button = document.getElementById('orderButton');
    const originalText = button.textContent;
    button.textContent = 'Creating order…';
    button.disabled = true;
    try {
        const csrftoken = getCookie('csrftoken');
        const orderResponse = await fetch('/shop/api/create-order/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': csrftoken
            },
            body: JSON.stringify({})
        });
        if (!orderResponse.ok) {
            const error = await orderResponse.json();
            throw new Error(error.error || 'Could not create order');
        }

        const order = await orderResponse.json();
        const sessionResponse = await fetch(`/shop/api/create-checkout-session/${order.order_id}/`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': csrftoken
            }
        });

        if (!sessionResponse.ok) {
            throw new Error('Could not create checkout session');
        }

        const session = await sessionResponse.json();
        window.location.href = session.session_url;
    } catch (error) {
        console.error('Order error:', error);
        alert(error.message || 'Could not complete checkout');
        button.textContent = originalText;
        button.disabled = false;
    }
}

document.addEventListener('DOMContentLoaded', loadCart);
</script>
{% endblock %}
