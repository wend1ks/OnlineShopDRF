{% extends 'base.html' %}
{% load static %}
{% block title %}{{ product.title|default:'Product' }}{% endblock %}
{% block link %}
<link rel="stylesheet" href="{% static 'css/product_detail.css' %}">
{% endblock %}
{% block content %}
<section class="product-detail">
    <div class="product-image">
        <img id="productImage" src="/static/images/no-image.png" alt="Product image">
    </div>
    <div class="product-detail-info">
        <h1 id="productTitle">Loading...</h1>
        <div class="price" id="productPrice"></div>
        <p class="desc" id="productDescription"></p>
        <div class="meta">
            <div>Category: <span id="productCategory">—</span></div>
            <div>In stock: <span id="productStock">—</span></div>
        </div>
        <div class="card-footer">
            <a class="btn btn-secondary btn-back" href="/shop/products/">Back to catalog</a>
        </div>
    </div>
</section>
<script>
const productId = window.location.pathname.split('/').filter(Boolean).pop();

async function ProductDetail() {
    const imageElement = document.getElementById('productImage');
    const titleElement = document.getElementById('productTitle');
    const priceElement = document.getElementById('productPrice');
    const descriptionElement = document.getElementById('productDescription');
    const categoryElement = document.getElementById('productCategory');
    const stockElement = document.getElementById('productStock');

    try {
        const response = await fetch(`/shop/api/products/${productId}/`);
        const product = await response.json();
        imageElement.src = product.image || '/static/images/no-image.png';
        imageElement.alt = product.title || 'Product image';
        titleElement.textContent = product.title || 'Untitled product';
        priceElement.textContent = new Intl.NumberFormat('en-US', {style:'currency', currency:'USD'}).format(Number(product.price || 0));
        descriptionElement.textContent = product.description || 'No description available.';
        categoryElement.textContent = product.category || '—';
        stockElement.textContent = product.stock_units || 0;
    } catch (error) {
        console.error(error);
        titleElement.textContent = 'Could not load product';
        descriptionElement.textContent = 'Please try refreshing the page.';
    }
}

ProductDetail();
</script>
{% endblock %}
