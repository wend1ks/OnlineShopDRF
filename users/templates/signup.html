{% extends 'base.html' %}
{% load static %}
{% block title %} Регистрация {% endblock %}
{% block link %}
<link rel="stylesheet" href="{% static 'css2/style3.css' %}">
{% endblock %}
{% block content %}
<div class="container">
    <h1>Регистрация</h1>
    <div class="form-field">
        <form id="signupForm" enctype="multipart/form-data">
            {% csrf_token %}
            <input type="text" name="username" class="input-field" placeholder="Имя пользователя" required>
            
            <input type="text" name="first_name" class="input-field" placeholder="Имя" required>
            <input type="text" name="last_name" class="input-field" placeholder="Фамилия" required>
            <input type="email" name="email" class="input-field" placeholder="Email" required>
            <input type="text" name="phone_number" class="input-field" placeholder="Номер телефона" required>
            <input type="file" name="user_image" class="file-input" accept="image/*">
            
            <div class="role-selection">
                <label>
                    <input type="radio" name="role" value="customer" checked>
                    Покупатель
                </label>
                <label>
                    <input type="radio" name="role" value="seller">
                    Продавец
                </label>
            </div>
            
            <input type="password" name="password" class="input-field" placeholder="Пароль" required minlength="8">
            <input type="password" name="password2" class="input-field" placeholder="Подтвердите пароль" required>
            
            <button type="button" onclick="signUp()" class="submit-btn">Зарегистрироваться</button>
            
        </form>
        
        <div id="message" class="message"></div>
    </div>
</div>

<script>
async function signUp() {
    const form = document.getElementById('signupForm');
    const formData = new FormData(form);
    
    const messageDiv = document.getElementById('message');
    messageDiv.innerHTML = '<p>Регистрация...</p>';
    messageDiv.className = 'message loading';
    
    try {
        const response = await fetch('http://127.0.0.1:8000/users/api/signup/', {
            method: 'POST',
            body: formData,
        }); 
        const data = await response.json();        
        if (response.ok) {
            messageDiv.innerHTML = `
                <p class="success">${data.message}</p>
                <p>Переход на страницу верификации...</p>
            `;
            messageDiv.className = 'message success';
            
            window.location.href = 'http://127.0.0.1:8000/users/verify-code/';            
        }
    } catch (error) {
        console.error('Fetch error:', error);
        messageDiv.innerHTML = `<p class="error">Ошибка соединения: ${error.message}</p>`;
        messageDiv.className = 'message error';
    }
}
</script>

{% endblock %}
